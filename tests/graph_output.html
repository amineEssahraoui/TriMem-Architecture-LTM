                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4f46e5", "font": {"color": "white"}, "id": "User", "label": "User", "shape": "dot", "size": 25}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "Amine", "label": "Amine", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "Multi-Agent Reinforcement Learning", "label": "Multi-Agent Reinforcement Learning", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "engineering student", "label": "engineering student", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "ENSAM Mekn\u00e8s", "label": "ENSAM Mekn\u00e8s", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "PyTorch", "label": "PyTorch", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "Python", "label": "Python", "shape": "dot", "size": 18}, {"color": "#06b6d4", "font": {"color": "white"}, "id": "AI agent system", "label": "AI agent system", "shape": "dot", "size": 18}]);

};
